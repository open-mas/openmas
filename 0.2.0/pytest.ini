[pytest]
# Define base test markers
markers =
    unit: Unit tests
    integration: Integration tests
    example: Example tests
    mcp: Tests that require MCP dependencies
    grpc: Tests that require gRPC dependencies
    mqtt: Tests that require MQTT dependencies
    sync: Synchronous tests
    async: Asynchronous tests (requires pytest-asyncio)

# Show extra test summary info for non-passing tests
addopts = -v

# Filter known warnings that are expected in the test suite
filterwarnings =
    # Coroutine warnings in mocked async code - warn in case we missed any
    # Complete filtering would use: ignore::RuntimeWarning
    default:coroutine '.*' was never awaited:RuntimeWarning

    # Resource warnings for unclosed network resources
    # Often appear in test teardown when using mocks
    ignore:unclosed <socket.socket.*:ResourceWarning
    ignore:unclosed transport.*:ResourceWarning

    # Ignore certain library-specific deprecation warnings we can't fix directly
    ignore:The loop argument is deprecated since.*:DeprecationWarning

    # For httpx-related eventloop warnings
    ignore:There is no current event loop.*:DeprecationWarning

    # For pytest-related import warnings
    ignore:.*cannot collect test class.*:pytest.PytestCollectionWarning
