[tool.poetry]
name = "openmas"
version = "0.3.0"
description = "OpenMAS: Advanced Multi-Agent Systems with Reasoning Agnosticism"
authors = ["Wilson Urdaneta <wilson.urdaneta@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "openmas", from = "src"}]
homepage = "https://openmas.ai"
repository = "https://github.com/openmas-ai/openmas"
documentation = "https://docs.openmas.ai"
keywords = ["multi-agent-systems", "mas", "agent", "ai", "mcp", "model-context-protocol", "reasoning-agnostic", "simf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[tool.poetry.scripts]
openmas = "openmas.cli:main"

[tool.poetry.dependencies]
python = "^3.10"
# Core dependencies
pydantic = "^2.8.0"
httpx = ">=0.27"
structlog = "^24.0.0"
fastapi = "^0.115.0"
pyyaml = "^6.0.1"
typer = "^0.15.0"
python-dotenv = "^1.1.0"
uvicorn = "^0.34.0"
filelock = "^3.18.0"
tomli = "^2.2.1"
# MCP and Protocol dependencies
mcp = "1.12.0"
httpx-sse = "^0.4.0"
jsonschema = "^4.20.0"
# Optional dependencies for different protocols
grpcio = { version = "^1.71.0", optional = true }
grpcio-tools = { version = "^1.71.0", optional = true }
protobuf = { version = ">=5.26.1,<6.0.0", optional = true }
paho-mqtt = { version = "^1.6.1", optional = true }
aiohttp = { version = "^3.11.0", optional = true }
# Utility dependencies
tqdm = { version = "^4.66.1", optional = true }

[tool.poetry.extras]
mcp = ["mcp", "httpx-sse", "jsonschema"]
grpc = ["grpcio", "grpcio-tools", "protobuf"]
mqtt = ["paho-mqtt"]
http = ["aiohttp"]
tqdm = ["tqdm"]
all = ["mcp", "httpx-sse", "jsonschema", "grpcio", "grpcio-tools", "protobuf", "paho-mqtt", "aiohttp", "tqdm"]

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-timeout = "^2.3.1"
pytest-mock = "^3.14.0"
pytest-xdist = "^3.6.0"
# Linting and formatting
ruff = "^0.1.0"
mypy = "==1.15.0"
# Type stubs
types-requests = "^2.31.0.0"
types-pyyaml = "^6.0.12.0"
types-setuptools = "^79.0.0.0"
types-paho-mqtt = "^1.6.0.0"
types-filelock = "^3.2.7"
types-tqdm = "^4.67.0.0"
# Dev tooling
tox = "^4.25.0"
pre-commit = "^4.2.0"
build = "^1.0.3"
# Documentation
mkdocs = "==1.6.1"
mkdocs-material = "==9.6.12"
mkdocstrings = {version = "==0.29.1", extras = ["python"]}
pymdown-extensions = "==10.15"
mkdocs-include-markdown-plugin = "==7.1.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ============================================================================
# Code Quality Configuration
# ============================================================================

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "SIM"]
ignore = ["E203"]
exclude = [
    ".git",
    "__pycache__",
    ".tox",
    ".eggs",
    "*.egg",
    "build",
    "dist",
    ".venv",
    "venv",
    "env",
    "refactoring_work/**",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["openmas"]
force-single-line = false
combine-as-imports = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = [
    "0\\.2\\.0/.*",
    "refactoring_work/.*",
    "build/.*",
    "dist/.*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/backup", "0.2.0", "refactoring_work", "build", "dist"]
python_files = "test_*.py"
asyncio_mode = "auto"
markers = [
    "unit: marks unit tests (fast, no external deps)",
    "integration: marks integration tests (may require external services)",
    "mcp: marks tests that require mcp dependencies",
    "grpc: marks tests that require grpc dependencies",
    "mqtt: marks tests that require mqtt dependencies",
    "http: marks tests that require http dependencies",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "real: marks tests that require real external services"
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--disable-warnings"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "0.2.0/*",
    "refactoring_work/*",
    "build/*",
    "dist/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
fail_under = 80

[tool.flake8]
max-line-length = 88
exclude = [
    ".git",
    "__pycache__",
    ".tox",
    ".venv",
    "build",
    "dist",
    "0.2.0"
]
ignore = [
    "E203",  # whitespace before ':'
    "W503",  # line break before binary operator
]
