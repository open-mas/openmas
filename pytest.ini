[pytest]
# Enable asyncio mode for all tests
asyncio_mode = auto

# Set reasonable timeout to prevent hanging tests  
timeout = 30

# Define test markers for organization and anti-hallucination
markers =
    unit: Unit tests (fast, minimal external dependencies)
    integration: Integration tests (real libraries, limited mocking)
    real: Tests against real external services (no mocking)
    mcp: Tests requiring MCP protocol
    slow: Tests that take >5 seconds
    anti_hallucination: Tests that validate against real implementations

# Default pytest options
addopts = 
    -v 
    --tb=short
    --asyncio-mode=auto
    --timeout=30
    --strict-markers
    --disable-warnings

# Filter known warnings that we can't control
filterwarnings =
    ignore::DeprecationWarning
    ignore::RuntimeWarning:asyncio
    ignore::pytest.PytestUnraisableExceptionWarning
    
# Test paths
testpaths = tests

# Minimum version requirements
minversion = 6.0
