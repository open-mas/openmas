# tox (https://tox.readthedocs.io/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
# Default environments to run when 'tox' is invoked without arguments.
# These cover linting, fast unit tests, and mocked integration tests.
envlist = lint, unit, integration-mock
isolated_build = True
skipsdist = False

[testenv]
# Base environment settings inherited by specific test environments
description = Base configuration for test environments
# Use Poetry for installation via 'poetry install'
# This keeps dependencies DRY by using what's defined in pyproject.toml
commands_pre =
    poetry install --with dev {env:TOX_EXTRAS:}
# Allowlist external commands used in test environments
allowlist_externals =
    pytest
    poetry
    mkdocs
    openmas
    python
    find
    xargs
# Commands are defined in specific environments below

[testenv:lint]
description = Run linters, formatters (check mode), and type checker across the codebase
# No extra dependencies needed, just dev dependencies from poetry
# which include all the linting tools
commands =
    # Check formatting without making changes
    python -m black . --check
    python -m isort . --check
    # Run the linter on source, tests, and examples
    python -m flake8 {toxinidir}/src {toxinidir}/tests {toxinidir}/examples
    # Run the type checker on source and tests
    python -m mypy --config-file=pyproject.toml {toxinidir}/src {toxinidir}/tests

[testenv:unit]
description = Run all unit tests (fast, no external deps)
commands =
    pytest {toxinidir}/tests/unit {posargs} -m "not slow"

[testenv:integration-mock]
description = Run integration tests using mocks (no real external services)
setenv =
    TOX_EXTRAS = --extras mcp
commands =
    pytest {toxinidir}/tests/integration {posargs} -m "not real"

[testenv:integration-real-mcp]
description = Run REAL integration tests requiring MCP services/libs
setenv =
    TOX_EXTRAS = --extras mcp
commands =
    # Test our MCP validation examples
    pytest {toxinidir}/examples/mcp_validation -v {posargs}
    # Test framework templates with real MCP
    pytest {toxinidir}/tests/framework/templates -v -m "mcp and real" {posargs}

[testenv:integration-real-grpc]
description = Run REAL integration tests requiring gRPC services/libs
setenv =
    TOX_EXTRAS = --extras grpc
commands =
    pytest {toxinidir}/tests/integration -v -m "grpc and real" {posargs}

[testenv:integration-real-mqtt]
description = Run REAL integration tests requiring MQTT broker
setenv =
    TOX_EXTRAS = --extras mqtt
commands =
    pytest {toxinidir}/tests/integration -v -m "mqtt and real" {posargs}

[testenv:integration-real-http]
description = Run REAL integration tests requiring HTTP services
setenv =
    TOX_EXTRAS = --extras http
commands =
    pytest {toxinidir}/tests/integration -v -m "http and real" {posargs}

[testenv:coverage]
description = Run coverage report across unit and mock integration tests
setenv =
    TOX_EXTRAS = --extras all
commands_pre =
    poetry install --with dev {env:TOX_EXTRAS:}
commands =
    # Run both unit and integration tests with coverage reporting
    # Keep the --cov-fail-under threshold reasonably achievable at 70% for now
    # Future improvements should raise this to 80% for core components
    pytest {toxinidir}/tests/unit {toxinidir}/tests/integration \
    --cov=src/openmas --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=70 -m "not real" {posargs}

[testenv:coverage-simf]
description = Run coverage report focused specifically on SIMF components
setenv =
    TOX_EXTRAS = --extras mcp
commands =
    # Targeted coverage for SIMF core components
    pytest {toxinidir}/tests/unit/core {toxinidir}/tests/integration/simf \
    --cov=src/openmas/core --cov-report=term --cov-report=xml:simf-coverage.xml --cov-fail-under=80 {posargs}

[testenv:coverage-mcp]
description = Run coverage report focused specifically on MCP integration
setenv =
    TOX_EXTRAS = --extras mcp
commands =
    # Targeted coverage for MCP components and validation
    pytest {toxinidir}/examples/mcp_validation {toxinidir}/tests/framework/templates \
    --cov=examples/mcp_validation --cov-report=term --cov-report=xml:mcp-coverage.xml --cov-fail-under=70 -m mcp {posargs}

[testenv:docs]
description = Build the documentation using MkDocs.
commands_pre =
    poetry install --with dev
commands =
    mkdocs build --clean --strict

[testenv:mkdocs-serve]
description = Serve documentation locally for development
commands_pre =
    poetry install --with dev
commands =
    mkdocs serve

[testenv:all-tests]
description = Run all tests (unit, integration, examples) - excludes real external service tests
setenv =
    TOX_EXTRAS = --extras all
commands =
    # Run unit tests
    pytest {toxinidir}/tests/unit -m "not slow"
    # Run integration tests with mocks
    pytest {toxinidir}/tests/integration -m "not real"
    # Run MCP validation examples
    pytest {toxinidir}/examples/mcp_validation
    # Note: Real integration tests are not included as they require external services
    # Run them separately with: tox -e integration-real-mcp, integration-real-grpc, etc.

[testenv:all-tests-including-real]
description = Run ALL tests including real external service tests (use with caution)
setenv =
    TOX_EXTRAS = --extras all
commands =
    # Run all unit tests
    pytest {toxinidir}/tests/unit
    # Run all integration tests including real services
    pytest {toxinidir}/tests/integration
    # Run MCP validation examples
    pytest {toxinidir}/examples/mcp_validation
    # Run framework template tests
    pytest {toxinidir}/tests/framework/templates

[testenv:quick]
description = Quick test run for development (unit tests only, fastest)
commands =
    pytest {toxinidir}/tests/unit -x -m "not slow" {posargs}

[testenv:simf]
description = Test only SIMF core functionality
setenv =
    TOX_EXTRAS = --extras mcp
commands =
    pytest {toxinidir}/tests/unit/core {toxinidir}/src/openmas/core -m "not slow" {posargs}

[testenv:mcp-validation]
description = Test MCP integration and validation
setenv =
    TOX_EXTRAS = --extras mcp
commands =
    pytest {toxinidir}/examples/mcp_validation -v {posargs}

[testenv:test-templates]
description = Test framework templates functionality
setenv =
    TOX_EXTRAS = --extras all
commands =
    pytest {toxinidir}/tests/framework/templates -v {posargs}

[testenv:singlefile]
description = Run specific test file(s) passed as arguments
setenv =
    TOX_EXTRAS = --extras all
commands_pre =
    poetry install --with dev {env:TOX_EXTRAS:}
commands =
    pytest {posargs}

[testenv:format]
description = Format code using black and isort
commands =
    python -m black .
    python -m isort .

[testenv:lint-fix]
description = Run linters and fix issues where possible
commands =
    python -m black .
    python -m isort .
    python -m flake8 {toxinidir}/src {toxinidir}/tests {toxinidir}/examples --exit-zero

[testenv:mypy-only]
description = Run only mypy type checking
commands =
    python -m mypy --config-file=pyproject.toml {toxinidir}/src {toxinidir}/tests

[testenv:clean]
description = Clean up build artifacts, cache files, and temporary files
allowlist_externals = 
    rm
    find
commands =
    rm -rf build/
    rm -rf dist/
    rm -rf .tox/
    rm -rf .pytest_cache/
    rm -rf .coverage
    rm -rf htmlcov/
    rm -rf .mypy_cache/
    find . -type d -name __pycache__ -exec rm -rf {} +
    find . -type f -name "*.pyc" -delete 