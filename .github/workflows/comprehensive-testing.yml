name: OpenMAS Comprehensive Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHONPATH: ${{ github.workspace }}/src
  COVERAGE_THRESHOLD: 85

jobs:
  # Matrix testing across Python versions and platforms
  test-matrix:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root
    
    - name: Install project
      run: poetry install --no-interaction
    
    - name: Run linting (Ruff)
      run: poetry run ruff check src/ tests/
    
    - name: Run type checking (MyPy)
      run: poetry run mypy src/ --strict
    
    - name: Run unit tests
      run: |
        poetry run pytest tests/unit/ \
          --verbose \
          --tb=short \
          --durations=10 \
          --junitxml=test-results-unit-${{ matrix.os }}-${{ matrix.python-version }}.xml
    
    - name: Run integration tests
      run: |
        poetry run pytest tests/integration/ \
          --verbose \
          --tb=short \
          --durations=10 \
          --junitxml=test-results-integration-${{ matrix.os }}-${{ matrix.python-version }}.xml
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: test-results-*.xml

  # Comprehensive coverage testing (Linux only for speed)
  coverage-testing:
    name: Coverage Testing
    runs-on: ubuntu-latest
    needs: test-matrix
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      run: poetry install --no-interaction
    
    - name: Run comprehensive test suite with coverage
      run: |
        poetry run pytest \
          --cov=src/openmas \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
          --verbose \
          --tb=short \
          --durations=20 \
          --junitxml=coverage-test-results.xml
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true
    
    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-html-report
        path: htmlcov/
    
    - name: Upload coverage XML report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-xml-report
        path: coverage.xml

  # Performance testing and benchmarking
  performance-testing:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: test-matrix
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      run: poetry install --no-interaction
    
    - name: Run performance tests
      run: |
        poetry run pytest tests/performance/ \
          --verbose \
          --tb=short \
          --durations=10 \
          --benchmark-json=benchmark-results.json \
          --junitxml=performance-test-results.xml
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: |
          benchmark-results.json
          performance-test-results.xml
    
    - name: Performance regression check
      run: |
        # Compare with baseline if available
        if [ -f "performance-baseline.json" ]; then
          poetry run python scripts/check_performance_regression.py \
            --current benchmark-results.json \
            --baseline performance-baseline.json \
            --tolerance 10
        fi

  # Protocol-specific testing
  protocol-testing:
    name: Protocol Testing
    runs-on: ubuntu-latest
    needs: test-matrix
    strategy:
      matrix:
        protocol: [mcp, a2a, http, mqtt]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      run: poetry install --no-interaction
    
    - name: Set up protocol-specific services
      run: |
        case "${{ matrix.protocol }}" in
          mqtt)
            docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:latest
            ;;
          http)
            # HTTP testing uses built-in test servers
            echo "HTTP testing uses built-in servers"
            ;;
          mcp)
            # MCP testing uses mock servers
            echo "MCP testing uses mock servers"
            ;;
          a2a)
            # A2A testing uses mock Google services
            echo "A2A testing uses mock services"
            ;;
        esac
    
    - name: Run protocol-specific tests
      run: |
        poetry run pytest tests/protocols/test_${{ matrix.protocol }}.py \
          --verbose \
          --tb=short \
          --durations=10 \
          --junitxml=protocol-${{ matrix.protocol }}-results.xml
    
    - name: Upload protocol test results
      uses: actions/upload-artifact@v3
      with:
        name: protocol-${{ matrix.protocol }}-results
        path: protocol-${{ matrix.protocol }}-results.xml

  # End-to-end testing
  e2e-testing:
    name: End-to-End Testing
    runs-on: ubuntu-latest
    needs: [test-matrix, protocol-testing]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      run: poetry install --no-interaction
    
    - name: Run end-to-end tests
      run: |
        poetry run pytest tests/e2e/ \
          --verbose \
          --tb=short \
          --durations=10 \
          --junitxml=e2e-test-results.xml
    
    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      with:
        name: e2e-test-results
        path: e2e-test-results.xml

  # Security and dependency scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      run: poetry install --no-interaction
    
    - name: Run safety check
      run: poetry run safety check
    
    - name: Run bandit security linter
      run: poetry run bandit -r src/ -f json -o bandit-report.json
    
    - name: Upload security scan results
      uses: actions/upload-artifact@v3
      with:
        name: security-scan-results
        path: bandit-report.json

  # Documentation testing
  docs-testing:
    name: Documentation Testing
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      run: poetry install --no-interaction
    
    - name: Test documentation examples
      run: |
        poetry run pytest tests/docs/ \
          --verbose \
          --tb=short \
          --junitxml=docs-test-results.xml
    
    - name: Build documentation
      run: |
        poetry run sphinx-build -b html docs/ docs/_build/html -W
    
    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: docs/_build/html/

  # Test result aggregation and reporting
  test-report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [coverage-testing, performance-testing, protocol-testing, e2e-testing, security-scan, docs-testing]
    if: always()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all test artifacts
      uses: actions/download-artifact@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Install dependencies
      run: poetry install --no-interaction
    
    - name: Generate comprehensive test report
      run: |
        poetry run python scripts/generate_test_report.py \
          --output-dir test-report/ \
          --coverage-xml coverage-xml-report/coverage.xml \
          --performance-json performance-results/benchmark-results.json \
          --security-json security-scan-results/bandit-report.json
    
    - name: Upload comprehensive test report
      uses: actions/upload-artifact@v3
      with:
        name: comprehensive-test-report
        path: test-report/
    
    - name: Comment PR with test summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = './test-report/summary.md';
          if (fs.existsSync(path)) {
            const summary = fs.readFileSync(path, 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
          }

  # Nightly baseline update
  update-baselines:
    name: Update Performance Baselines
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    needs: [performance-testing]
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Download performance results
      uses: actions/download-artifact@v3
      with:
        name: performance-results
    
    - name: Update performance baseline
      run: |
        cp benchmark-results.json performance-baseline.json
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add performance-baseline.json
        git commit -m "Update performance baseline [skip ci]" || exit 0
        git push
