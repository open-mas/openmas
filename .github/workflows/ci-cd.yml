name: OpenMAS 0.3.0 CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ] # Trigger on tags like v1.2.3
  pull_request:
    branches: [ main ]

permissions:
  contents: read # Default read permission

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Use the lowest supported Python version for broader compatibility checks
        # Add other versions if needed, but one is usually sufficient for CI checks
        python-version: ["3.10"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install Tox
      run: pipx install tox

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies if cache doesn't exist
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root --with dev --extras "all" # Install all deps for coverage

    - name: Run linters
      run: poetry run tox -e lint

    - name: Run unit tests
      run: poetry run tox -e unit

    - name: Run mock integration tests
      run: poetry run tox -r -e integration-mock

    - name: Run SIMF core tests
      run: |
        # Test SIMF core functionality specifically
        poetry install --no-interaction --extras "mcp"
        poetry run tox -r -e simf

    - name: Run MCP validation tests
      run: |
        # Test our MCP 1.12.0 integration and validation
        poetry install --no-interaction --extras "mcp"
        poetry run tox -r -e mcp-validation

    - name: Run test framework templates
      run: |
        # Test our framework templates for anti-hallucination
        poetry install --no-interaction --extras "all"
        poetry run tox -r -e test-templates

    - name: Run real MCP integration tests
      run: |
        # Ensure MCP dependencies are installed
        poetry install --no-interaction --extras "mcp"
        poetry run tox -r -e integration-real-mcp
      # These tests require actual MCP services to be available
      continue-on-error: true  # Allow CI to continue if these tests fail

    - name: Run real gRPC integration tests
      run: |
        # Ensure gRPC dependencies are installed
        poetry install --no-interaction --extras "grpc"
        poetry run tox -r -e integration-real-grpc
      continue-on-error: true  # Allow CI to continue if these tests fail

    - name: Run real MQTT integration tests
      run: |
        # Ensure MQTT dependencies are installed
        poetry install --no-interaction --extras "mqtt"
        poetry run tox -r -e integration-real-mqtt
      continue-on-error: true  # Allow CI to continue if these tests fail

    - name: Run real HTTP integration tests
      run: |
        # Ensure HTTP dependencies are installed
        poetry install --no-interaction --extras "http"
        poetry run tox -r -e integration-real-http
      continue-on-error: true  # Allow CI to continue if these tests fail

    - name: Run tests with coverage check (fail < 70%)
      run: poetry run tox -e coverage # This env generates coverage.xml and fails if below threshold

    - name: Upload coverage report to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # Required for private repos or specific org settings
        files: ./coverage.xml
        fail_ci_if_error: true # Recommended to fail the build if upload fails
        # The coverage threshold is enforced by `tox -e coverage`, not here.

    - name: Run SIMF-specific coverage (stricter threshold)
      run: |
        # SIMF is critical - enforce higher coverage
        poetry run tox -e coverage-simf
      continue-on-error: true  # Don't fail CI but report issues

    - name: Run MCP-specific coverage
      run: |
        # MCP integration coverage
        poetry run tox -e coverage-mcp
      continue-on-error: true  # Don't fail CI but report issues

    - name: Build documentation
      run: poetry run tox -e docs

    - name: Build package artifacts
      run: poetry build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-${{ matrix.python-version }}
        path: dist/

  # Security and code quality analysis
  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Run Bandit Security Lint
      uses: securecodewarrior/github-action-bandit@v1
      with:
        path: "src/"
      continue-on-error: true

  # Test on multiple Python versions for compatibility
  compatibility_test:
    name: Python ${{ matrix.python-version }} Compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install dependencies
      run: poetry install --no-interaction --with dev --extras "all"

    - name: Run quick compatibility test
      run: poetry run pytest tests/unit -x -m "not slow" --tb=short

  publish:
    name: Publish to PyPI and Create Release
    needs: [build_and_test, security_scan, compatibility_test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # Only run on tag pushes

    environment: release

    permissions:
      contents: write # Needed to create GitHub releases
      # Use id-token: write for PyPI trusted publishing (preferred)
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10" # Use a fixed version for publishing consistency

    - name: Install Poetry
      uses: snok/install-poetry@v1

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        # Artifact name must match the upload step
        name: python-package-3.10 # Assuming 3.10 was the build python version
        path: dist/

    - name: Publish package to PyPI
      # Using PyPI trusted publishing (OIDC) - configure this in PyPI project settings
      # run: poetry publish
      # run: poetry publish --username __token__ --password ${{ secrets.PYPI_TOKEN }}
      # Fallback using API token (less secure):
      env:
        POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
      run: poetry publish

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/* # Attach all files from the dist directory (sdist and wheel)
        generate_release_notes: true
        body: |
          ## OpenMAS 0.3.0 Release
          
          This release includes:
          - 🚀 Reasoning-agnostic multi-agent framework
          - 🔄 Standard Internal Message Format (SIMF)
          - 🌐 MCP 1.12.0 integration with 2025-06-18 specification support
          - 🧪 Comprehensive test framework templates
          - 🔧 Protocol adapters for MCP, gRPC, MQTT, HTTP
          - 📊 Anti-hallucination validation system
          
          See the changelog for full details.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Provided by Actions 